<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Moved Permanently</title>
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fallback for no-JS clients (cannot preserve deep path) -->
  <meta http-equiv="refresh" content="0; url=https://mudcalendar.heron.li/" />
  <link rel="canonical" href="https://mudcalendar.heron.li/" />

  <script>
    (function () {
      var TARGET_ORIGIN = "https://mudcalendar.heron.li";
      var PROJECT_PREFIX = "/Heron.MudCalendar";

      var path = window.location.pathname || "/";
      if (path === PROJECT_PREFIX) {
        path = "/";
      } else if (path.indexOf(PROJECT_PREFIX + "/") === 0) {
        path = path.slice(PROJECT_PREFIX.length);
      }

      var destination = TARGET_ORIGIN + path + window.location.search + window.location.hash;
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://mudcalendar.heron.li/">https://mudcalendar.heron.li/</a>.</p>
</body>
</html>
